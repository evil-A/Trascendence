{% block content %}
<br>
<h2> Social </h2>
<ul class="nav nav-pills nav-fill" id="social_tab" role = "tablist">
    <li class="nav-item"  style="position: relative;">
        <div class = "dropdown border w-100" id="searchDropdown"  data-bs-toggle="dropdown" aria-expanded="false">
            <input class="form-control" name="search" placeholder="Search Users"
            hx-post="/social/search/" hx-trigger="input changed delay:500ms, search" 
            hx-target="#search" hx-indicator=".htmx-indicator" style="text-decoration: none;" id="searchInput">
        </div>
        <ul id="search" class = "dropdown-menu w-50" aria-labelledby="searchDropdown"></ul>
    </li>
    <li class="nav-item">
        <a class="nav-link" id="friends-tab" hx-get = "/social/friend/" hx-target="#myTabContent" data-toggle="tab" role="tab" aria-controls="friend" aria-selected="false">Friends</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" id="app-tab" hx-get = "/social/applications/" hx-target="#myTabContent" data-toggle="tab" role="tab" aria-controls="apply" aria-selected="false">
            Applications
            {% if requests %}
                <span class = "badge bg-danger" id="pendingApplications">{{requests}}</span>
            {% endif %}
        </a>
    </li>
</ul>
<div class="container mt-5 tab-content" id="myTabContent">
</div>
{% endblock %}
