{% block content %}
    <div class = "container mt-4">
        <h2>Edit profile</h2>
        <form  hx-post="{% url 'profile_edit' %}" hx-target="#profileContent" hx-push-url = "/oauth2/profile/" enctype="multipart/form-data">
            {% if form.non_field_errors %}
                <div class="alert alert-danger mt-4" style="marker: none;" role="alert">
                    {% for error in form.non_field_errors %}
                        {{ error }}<br>
                    {% endfor %}</div>
                </div>
            {% endif %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label}}</label><br>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-danger" style="marker: none;">
                        {% for error in field.errors %}
                            {{ error }}<br>
                        {% endfor %}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
{% endblock %}
