{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <h2>Chat</h2>
    <div id="chat-messages" class="border rounded p-3" style="height: 300px; overflow-y: auto;">
    </div>
    <form id="chat-form" class="mt-3" onsubmit="return false">
        <div class="input-group">
            <input type="text" name="message" id="chat-input" class="form-control" placeholder="Escribe tu mensaje..." aria-label="Message">
            <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const username = "{{ request.user.username }}";

        console.log("Username:", username);
        
        const chatSocket = new WebSocket(`ws://${window.location.host}/ws/chat/`);

        chatSocket.onopen = function(e) {
            console.log("WebSocket connection established");
        };

        chatSocket.onerror = function(e) {
            console.error("WebSocket error:", e);
        };

        chatSocket.onmessage = function (e) {
            console.log("Message received:", e.data);
            const data = JSON.parse(e.data);
            const chatMessagesDiv = document.getElementById("chat-messages");
            const messageElement = document.createElement("p");
            messageElement.textContent = `${data.username}: ${data.message}`;
            chatMessagesDiv.appendChild(messageElement);
            chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
        };

        document.getElementById('chat-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const messageInput = document.getElementById('chat-input');
            const from = document.getElementById('chat-form');
            const message = messageInput.value.trim();
            
            if (message === "") {
                alert("No puedes enviar un mensaje vacio.");
                return;
            }

            console.log("Sending message:", message);
        
            chatSocket.send(JSON.stringify({
                message: message,
                username: username,
            }));

            messageInput.value = "";
        });

        // Also handle enter key
        //messageInput.addEventListener('keypress', function(event) {
        //    if (event.key === 'Enter') {
        //        event.preventDefault();
        //        form.dispatchEvent(new Event('submit'));
        //    }
        //});

        chatSocket.onclose = function (e) {
            console.error("Cierre de socket inesperado");
        };
    }); // This closing bracket was missing
</script>
{% endblock %}
