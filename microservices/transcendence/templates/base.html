{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
    <title>{% block title %}Pong{% endblock %}</title>
</head>
<body class = "vh-100 overflow-hidden" hx-push-url="true">
    <div id = root>
        {% block content %}        
            {% if not user %}
                <div class="container mt-5">
                    <h1 class="text-center mb-4">Welcome</h1>
                    <div class="text-center">
                        <a href="{% url 'oauth_login' %}" class="btn btn-primary me-2">Login with OAuth</a>
                        <button class="btn btn-secondary me-2" hx-get = "{% url 'login' %}" hx-target="#simpleForm">Simple Login</button>
                        <button class="btn btn-secondary me-2" hx-get = "{% url 'register' %}" hx-target="#simpleForm">Register</button>
                    </div>
                    <div class="mt-4 text-center" id="simpleForm">
                        {% if root_content %}
                            {{root_content|safe}}
                        {% else %}
                            {% block form %}{% endblock %}
                        {% endif %}
                    </div>
                </div>
            {% else %}
                {% include 'spa_content.html' %}
            {% endif %}
        {% endblock %}
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
