{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
    <title>{% block title %}Kickoff Stars{% endblock %}</title>
</head>
<body>
    <div id="root">
        {% block content %}
            {% if not user %}
                <div class="container mt-5">
                    <h1 class="text-center mb-4">Welcome</h1>
                    <div class="text-center">
                        <a href="{% url 'oauth_login' %}" class="btn btn-primary me-2">Login with OAuth</a>
                        <button class="btn btn-secondary me-2" 
                                hx-get="{% url 'login' %}" 
                                hx-target="#simpleForm" 
                                hx-push-url="true">
                            Simple Login
                        </button>
                        <button class="btn btn-secondary me-2" 
                                hx-get="{% url 'register' %}" 
                                hx-target="#simpleForm" 
                                hx-push-url="true">
                            Register
                        </button>
                    </div>
                    <div class="mt-4 text-center" id="simpleForm">{% block form %}{% endblock %}</div>
                </div>
            {% else %}
                {% include 'spa_content.html' %}
            {% endif %}
        {% endblock %}
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
