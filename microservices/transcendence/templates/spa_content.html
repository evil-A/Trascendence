<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Kickoff Stars | Pong</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.0"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Navbar - OUTSIDE the dynamic content area -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" onclick="loadMainContent('/')">Kickoff Stars</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <button class="nav-link dropdown-toggle btn btn-link" id="gameDropdown"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-controller"></i> Game
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="gameDropdown">
                            <li>
                                <a class="dropdown-item" href="#" onclick="loadMainContent('/oauth2/game/ai')">
                                    Play vs AI
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#" onclick="loadMainContent('/oauth2/game/player')">
                                    Play vs Player
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadMainContent('/chat/')">
                            <i class="bi bi-chat-dots"></i> Chat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="loadMainContent('/oauth2/tournaments/')">
                            <i class="bi bi-trophy"></i> Tournaments
                        </a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <div class="nav-item dropdown">
                        <button class="nav-link dropdown-toggle btn btn-link" id="profileDropdown"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="{{ user.avatar }}" alt="Profile" class="rounded-circle" width="32" height="32">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li>
                                <a class="dropdown-item" href="#" onclick="loadMainContent('/oauth2/profile/')">
                                    Profile
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="/oauth2/logout/">Logout</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Loading indicator -->
    <div id="loading" class="text-center d-none mt-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <!-- Main content container - THIS is where content will be loaded -->
    <div class="container mt-4">
        <div id="main-content">
            <!-- Default content - will be replaced dynamically -->
            <div class="text-center">
                <h2>Welcome to Pong!</h2>
                <p>Select an option from the navigation bar to get started.</p>
            </div>
        </div>
    </div>
    
    <!-- Footer - OUTSIDE the dynamic content area -->
    <footer class="py-3 mt-5 bg-dark text-light">
        <div class="container text-center">
            <p class="m-0">Copyright &copy; Kickoff Stars 2025</p>
        </div>
    </footer>
    
    <!-- Scripts -->
    <script>
        // Your existing JavaScript here
        // ...
    </script>
</body>
</html>
