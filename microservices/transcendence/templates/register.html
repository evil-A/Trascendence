{% block form %}
    <h2>Register</h2>
    {% if form.non_field_errors %}
        <div class="alert alert-danger mt-4" style="marker: none;" role="alert">
            {% for error in form.non_field_errors %}
                {{ error }}<br>
            {% endfor %}</div>
        </div>
    {% endif %}
    <form  hx-post="{% url 'register' %}" hx-target="#simpleForm">
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label}}</label><br>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger" style="marker: none;">
                    {% for error in field.errors %}
                        {{ error }}<br>
                    {% endfor %}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Register</button>
    </form>
{% endblock %}
